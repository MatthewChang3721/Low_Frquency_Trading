[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-frequency-trading"
version = "0.1.0"
description = "US equity low-frequency quantitative research system (data system MVP)."
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "pyarrow",
    "pandas",
    "numpy",
    "yfinance",
    "httpx",
    "pydantic",
    "pandera",
    "exchange-calendars",
    "tenacity",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools]
packages = ["data_sys", "data_sys.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
